name: CI

"on":
  push:
    branches:
      - feat/autonomous-ctf-agent-v3
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate TOML configuration
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          for path in pathlib.Path(".").glob(".codex/**/*.toml"):
              with path.open("rb") as handle:
                  tomllib.load(handle)
              print(f"valid toml: {path}")
          PY
      - name: Check skill frontmatter
        run: |
          python - <<'PY'
          import pathlib

          for path in pathlib.Path("skills").glob("*/SKILL.md"):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise SystemExit(f"missing frontmatter: {path}")
              head = text.split("---", 2)[1]
              if "name:" not in head or "description:" not in head:
                  raise SystemExit(f"incomplete frontmatter: {path}")
              print(f"valid skill metadata: {path}")
          PY
      - name: Run package checks when implemented
        run: |
          if [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip uv
            python -m pip install -e ".[dev]"
            if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            unshare --user --map-root-user --net -- true
            ruff check .
            mypy src
            python -m compileall -q src tests evals
            uv build --out-dir /tmp/ctf-agent-dist
            pytest -m "not benchmark and not slow"
          else
            echo "pyproject.toml not present yet; skipped package checks."
          fi
      - name: Verify pipx installation and CLI entry point
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pipx
          pipx install . --force
          PIPX_VENVS="$(pipx environment --value PIPX_LOCAL_VENVS)"
          PIPX_CLI="$PIPX_VENVS/ctf-agent-codex/bin/ctf-agent"
          "$PIPX_CLI" --help
          "$PIPX_CLI" solve --help
          "$PIPX_CLI" resume --help
          "$PIPX_CLI" retry-evidence --help
          "$PIPX_CLI" benchmark --help
          "$PIPX_CLI" doctor --help

  ctf-tool-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned CTF tool image
        run: docker build -t ctf-agent-codex-tools:0.1.0 -f docker/ctf-tools/Dockerfile .
      - name: Verify non-root tool availability and isolation flags
        run: |
          test "$(docker image inspect ctf-agent-codex-tools:0.1.0 --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm \
            --network=none \
            --read-only \
            --pids-limit=64 \
            --memory=256m \
            --cpus=1 \
            --tmpfs=/tmp:rw,noexec,nosuid,size=16m \
            ctf-agent-codex-tools:0.1.0 \
            sh -c 'test "$(id -u)" != 0 && for tool in python3 file strings objdump readelf exiftool binwalk checksec foremost tshark; do command -v "$tool"; done'
      - name: Record installed tool versions
        run: |
          docker run --rm --network=none ctf-agent-codex-tools:0.1.0 sh -c \
            'python3 --version; file --version | head -1; exiftool -ver; binwalk --help | head -1; checksec --version || true; tshark --version | head -1'

  playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Chromium
        run: |
          python -m pip install -e ".[browser]"
          playwright install --with-deps chromium
      - name: Render a real terminal screenshot
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ctf_agent.evidence import TerminalRenderer

          with TemporaryDirectory() as directory:
              result = TerminalRenderer().render("flag{ci_screenshot}\n", Path(directory))
              assert result.png_path is not None and result.png_path.is_file()
              assert result.png_path.stat().st_size > 0
          PY
