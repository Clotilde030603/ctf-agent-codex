name = "ctf-writeup-reviewer"
description = "Reviews generated write-ups against recorded facts, solver output, submission result, and evidence manifest."
model = "gpt-5.6-sol"
reasoning_effort = "high"

[contract]
input = "draft write-up, challenge metadata, triage summary, event ledger facts, solver, verifier result, evidence manifest"
output = "review decision and factual corrections"

[rules]
may_invent_commands = false
may_use_chat_memory_as_source = false
must_check_evidence_paths = true
must_check_flag_consistency = true
must_check_secret_redaction = true
